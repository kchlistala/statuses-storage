services:
  _defaults:
    autowire: true
    autoconfigure: true
    public: false
    bind:
      $projectDir: '%kernel.project_dir%'

  _instanceof:
    Symfony\Component\Console\Command\Command:
      tags: ['app.console_command']
    App\Shared\Kafka\Public\JobHandlerInterface:
      tags: ['app.kafka_job_handler']

  # Autodiscovery for every class under src/, Public and Internal alike.
  # DI must see Internal classes to be able to build them - module boundaries
  # are enforced statically (PHPStan custom rule + Deptrac), not by hiding
  # services from the container.
  App\:
    resource: '../src/*'
    exclude:
      - '../src/Kernel/ContainerFactory.php'

  # Logging
  Psr\Log\LoggerInterface:
    factory: ['App\Kernel\Log\LoggerFactory', 'create']

  # HTTP
  Psr\Http\Server\RequestHandlerInterface: '@League\Route\Router'
  League\Route\Router:
    factory: ['App\Kernel\Http\RouterFactory', 'create']

  # Cache (RoadRunner KV)
  App\Shared\Cache\Public\CacheInterface: '@App\Shared\Cache\Internal\RoadRunnerKvCache'
  Spiral\RoadRunner\KeyValue\Factory:
    factory: ['App\Shared\Cache\Internal\KvFactoryFactory', 'create']

  # Kafka (RoadRunner Jobs plugin - consume and produce)
  App\Shared\Kafka\Public\ProducerInterface: '@App\Shared\Kafka\Internal\RoadRunnerJobsProducer'
  Spiral\RoadRunner\Jobs\Jobs:
    factory: ['App\Shared\Kafka\Internal\JobsFactoryFactory', 'create']
  App\Shared\Kafka\Public\JobDispatcherInterface: '@App\Shared\Kafka\Internal\TaggedJobDispatcher'
  App\Shared\Kafka\Internal\TaggedJobDispatcher:
    arguments:
      $handlers: !tagged_iterator app.kafka_job_handler

  # Database (Doctrine DBAL - no ORM)
  Doctrine\DBAL\Connection:
    factory: ['App\Shared\Database\Internal\ConnectionFactory', 'create']
    arguments:
      $databaseUrl: '%env(DATABASE_URL)%'

  Doctrine\Migrations\DependencyFactory:
    factory: ['App\Shared\Database\Internal\MigrationsFactory', 'create']
    arguments:
      $connection: '@Doctrine\DBAL\Connection'
      $projectDir: '%kernel.project_dir%'

  Doctrine\Migrations\Tools\Console\Command\MigrateCommand:
    arguments: ['@Doctrine\Migrations\DependencyFactory']
  Doctrine\Migrations\Tools\Console\Command\StatusCommand:
    arguments: ['@Doctrine\Migrations\DependencyFactory']
  Doctrine\Migrations\Tools\Console\Command\LatestCommand:
    arguments: ['@Doctrine\Migrations\DependencyFactory']
  Doctrine\Migrations\Tools\Console\Command\ExecuteCommand:
    arguments: ['@Doctrine\Migrations\DependencyFactory']
  Doctrine\Migrations\Tools\Console\Command\GenerateCommand:
    arguments: ['@Doctrine\Migrations\DependencyFactory']

  # Console
  App\Kernel\Console\ConsoleApplicationFactory:
    public: true
    arguments:
      $commands: !tagged_iterator app.console_command

  # Entrypoints fetched directly from the container in bin/worker.php
  App\Kernel\Http\HttpWorkerRunner:
    public: true

  App\Kernel\Jobs\JobsWorkerRunner:
    public: true
